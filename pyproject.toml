[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-harness-agent"
version = "0.1.0"
description = "Scientist-guided regression analysis with tool use and discoverable failure groups"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.2", "jsonschema>=4", "requests>=2.31", "truststore>=0.9", "threadpoolctl>=3.5"]

[project.scripts]
eval-analysis = "eval_analysis.cli:main"

[tool.setuptools.packages.find]
include = ["eval_analysis*"]
